 const we=d=>{ const w=d.getUTCDay(); return w===5||w===6; }, ds=d=>d.toISOString().slice(0,10), money=x=>Math.round(x*100)/100;
 const base=[]; for(let k=0;k<230;k++){ let d; do{ d=new Date(start+Math.floor(r()*181)*day); }while(we(d)); const v=Math.min(V.length-1,Math.floor(Math.pow(r(),1.5)*V.length)); base.push({d,v,a:money(TX_SCALE[v]*Math.exp((r()-0.5)*1.3))}); }
 base.sort((a,b)=>a.d-b.d); let inv=1000; const rows=base.map(x=>{ inv++; if(r()<0.015) inv+=1+Math.floor(r()*3); return [ds(x.d),V[x.v],'INV-'+inv,x.a]; });
 const extra=[];
 [17,88,151].forEach(i=>extra.push([...rows[i]]));
 [40,120].forEach(i=>{ const x=rows[i], d=new Date(Date.parse(x[0])+4*day); extra.push([ds(d),x[1],'INV-'+(++inv),x[3]]); });
 [9850,9920,9780,9960].forEach((a,i)=>extra.push([ds(new Date(Date.UTC(2025,3,13+i))),V[4],'INV-'+(++inv),a]));
 [9890,9700].forEach((a,i)=>extra.push([ds(new Date(Date.UTC(2025,1,10+i*2))),V[2],'INV-'+(++inv),a]));
 [[2,7],[3,14],[4,25],[5,9],[5,30]].forEach(([m,dd],i)=>{ let d=new Date(Date.UTC(2025,m,dd)); while(d.getUTCDay()!==5) d=new Date(+d+day); extra.push([ds(d),V[[0,6,9,1,4][i]],'INV-'+(++inv),money(TX_SCALE[[0,6,9,1,4][i]]*(0.8+r()*0.4))]); });
 extra.push(['2025-05-21',V[7],'INV-'+(++inv),money(TX_SCALE[7]*14.5)]);
 [[5000,0],[20000,6],[15000,9],[30000,1]].forEach(([a,v],i)=>extra.push([ds(new Date(Date.UTC(2025,2+i,3+i*5))),V[v],'INV-'+(++inv),a]));

function seqRender(root){ txPage(root,pageHead('فحص تسلسل المستندات','Document Sequence Check','يكشف الأرقام المفقودة في تسلسل الفواتير أو الشيكات أو السندات، والأرقام المكررة، والأرقام المسجلة بتاريخ أقدم من سابقتها.','Finds missing numbers in invoice, cheque or voucher sequences, duplicated numbers, and numbers dated earlier than the one before them.'),(B,rows)=>{
 const pre=new Map(); rows.filter(r=>isFinite(r.invNum)).forEach(r=>{ if(!pre.has(r.invPre)) pre.set(r.invPre,[]); pre.get(r.invPre).push(r); });
 const series=[...pre.entries()].sort((a,b)=>b[1].length-a[1].length)[0]; if(!series){ B.innerHTML=`<p class="empty">${T('لا توجد أرقام مستندات رقمية.','No numeric document numbers found.')}</p>`; return; }
 const [prefix,list]=series; const s=[...list].sort((a,b)=>a.invNum-b.invNum||a.t-b.t); const lo=s[0].invNum, hi=s[s.length-1].invNum;
 const gaps=[], dups=[], back=[]; for(let i=1;i<s.length;i++){ const d=s[i].invNum-s[i-1].invNum; if(d>1) gaps.push({from:s[i-1].invNum+1,to:s[i].invNum-1,n:d-1}); if(d===0) dups.push(s[i-1],s[i]); else if(isFinite(s[i].t)&&isFinite(s[i-1].t)&&s[i].t<s[i-1].t-3*864e5) back.push({...s[i],prevDs:s[i-1].ds,prevInv:s[i-1].inv}); }
 const missing=gaps.reduce((a,g)=>a+g.n,0), uniqDups=[...new Map(dups.map(r=>[r.i,r])).values()];
 B.innerHTML=`<div class="kpis">${kpi(T('النطاق','Range'),`${lo} – ${hi}`,'',`${T('البادئة','Prefix')}: ${esc(prefix||'—')}`)}${kpi(T('المستندات','Documents'),s.length)}${kpi(T('أرقام مفقودة','Missing numbers'),missing,missing?'warn':'good',`${gaps.length} ${T('فجوة','gaps')}`)}${kpi(T('أرقام مكررة','Duplicated numbers'),uniqDups.length,uniqDups.length?'bad':'good')}${kpi(T('خارج الترتيب الزمني','Out of date order'),back.length,back.length?'warn':'good')}</div>
  <div class="panel"><h3>${T('1. الفجوات في التسلسل','1. Gaps in the sequence')}</h3><p class="note">${T('كل رقم مفقود يجب أن يكون له تفسير: مستند ملغى محفوظ، أو تالف. المستند المفقود بلا تفسير قد يكون استُخدم خارج النظام.','Every missing number needs an explanation: a voided document on file, or a damaged one. An unexplained gap may have been used outside the system.')}</p>
   ${gaps.length?`<div class="tbl-wrap" style="max-height:360px;overflow-y:auto"><table><thead><tr><th class="n">${T('من','From')}</th><th class="n">${T('إلى','To')}</th><th class="n">${T('عدد المفقود','Missing')}</th></tr></thead><tbody>${gaps.map(g=>`<tr><td class="n">${esc(prefix)}${g.from}</td><td class="n">${esc(prefix)}${g.to}</td><td class="n">${g.n}</td></tr>`).join('')}</tbody></table></div>`:`<div class="callout good">${T('التسلسل مكتمل.','The sequence is complete.')}</div>`}</div>
  <div class="panel"><h3>${T('2. أرقام مستخدمة أكثر من مرة','2. Numbers used more than once')}</h3>${txTable(uniqDups)}</div>
  <div class="panel"><h3>${T('3. رقم أحدث بتاريخ أقدم','3. Later number, earlier date')}</h3><p class="note">${T('مستند رقمه أكبر لكن تاريخه أقدم من سابقه بأكثر من 3 أيام، وقد يعني تعديل التاريخ أو إدخالاً متأخراً بتاريخ قديم.','A higher number dated more than 3 days before the previous one: possibly a changed date or a backdated entry.')}</p>
   ${txTable(back,`<th>${T('المستند السابق','Previous')}</th>`,r=>`<td class="n">${esc(r.prevInv)} · ${esc(r.prevDs)}</td>`)}</div>`; }); }

const MUS_R={90:[2.31,1.5],95:[3.0,1.6],99:[4.61,1.9]};
function sampRender(root){ txPage(root,pageHead('عينات التدقيق الإحصائية','Statistical Audit Sampling','يحسب حجم العينة المطلوب ويختارها لك من المعاملات بطريقة وحدة النقد (MUS) التي تعطي الفواتير الكبيرة فرصة أكبر للاختيار، أو بالعينة العشوائية البسيطة.','Calculates the required sample size and selects it from the transactions using monetary unit sampling (larger invoices are more likely to be picked) or simple random sampling.'),(B,rows,re)=>{
 const BV=rows.reduce((s,r)=>s+Math.abs(r.amt),0), [Rf,EF]=MUS_R[tx.conf]||MUS_R[95];
 if(!tx.tm) tx.tm=String(Math.round(BV*0.05)); const TM=num(tx.tm), EM=num(tx.em)||0;
 let n=TM>EM*EF?Math.ceil(Rf*BV/(TM-EM*EF)):NaN; if(tx.method==='random'&&num(tx.n)>0) n=Math.round(num(tx.n)); n=Math.min(n,rows.length);
 let pick=[];
 if(isFinite(n)&&n>0){ const rng=mulberry32(Math.round(num(tx.seed))||1);
  if(tx.method==='mus'){ const I=BV/n, start=rng()*I; let cum=0, k=0, next=start; rows.forEach(r=>{ const a=Math.abs(r.amt), lo=cum; cum+=a; let hits=0; while(next<cum){ hits++; next+=I; } if(hits) pick.push({...r,hits,top:a>=I}); }); }
  else { const idx=[...rows.keys()]; for(let i=idx.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; } pick=idx.slice(0,n).sort((a,b)=>a-b).map(i=>rows[i]); } }
 const cov=pick.reduce((s,r)=>s+Math.abs(r.amt),0), csv=['line,date,vendor,invoice,amount',...pick.map(r=>[r.line,r.ds,`"${String(r.vendor).replace(/"/g,'""')}"`,r.inv,r.amt].join(','))].join('\n');

   <label class="pf"><span>${T('مستوى الثقة','Confidence')}</span><select id="sp-c">${[90,95,99].map(c=>`<option value="${c}"${+tx.conf===c?' selected':''}>${c}%</option>`).join('')}</select></label>
   <label class="pf"><span>${T('الخطأ المسموح به (المادية)','Tolerable misstatement')}</span><input id="sp-tm" value="${esc(tx.tm)}" dir="ltr" inputmode="decimal"></label>
   <label class="pf"><span>${T('الخطأ المتوقع','Expected misstatement')}</span><input id="sp-em" value="${esc(tx.em)}" dir="ltr" inputmode="decimal"></label>
   ${tx.method==='random'?`<label class="pf"><span>${T('حجم العينة (اختياري)','Sample size (optional)')}</span><input id="sp-n" value="${esc(tx.n)}" dir="ltr" inputmode="numeric"></label>`:''}
   <label class="pf"><span>${T('رقم البذرة','Seed')}</span><input id="sp-s" value="${esc(tx.seed)}" dir="ltr" inputmode="numeric"></label></div>
   <p class="note">${T('حجم عينة MUS = عامل الثقة × قيمة المجتمع ÷ (الخطأ المسموح − الخطأ المتوقع × معامل التوسع). عوامل الثقة لصفر أخطاء: 2.31 و3.00 و4.61. الخطأ المسموح الافتراضي 5% من الإجمالي، عدّله حسب تقديرك للمادية. البذرة نفسها تعطي نفس العينة، فاحفظها في أوراق العمل.','MUS sample size = reliability factor × population value ÷ (tolerable − expected × expansion factor). Zero-error reliability factors: 2.31, 3.00, 4.61. Default tolerable misstatement is 5% of the total; set it to your materiality. The same seed gives the same sample, so record it in your working papers.')}</p></div>
  <div class="kpis">${kpi(T('قيمة المجتمع','Population value'),fmt(BV),'',`${rows.length} ${T('معاملة','items')}`)}${kpi(T('حجم العينة','Sample size'),isFinite(n)?n:'—',isFinite(n)?'good':'bad')}${tx.method==='mus'&&isFinite(n)?kpi(T('فترة الاختيار','Sampling interval'),fmt(BV/n)):''}${kpi(T('المعاملات المختارة','Items selected'),pick.length,'',T('نسبة القيمة المغطاة','value covered')+' '+pct(BV?cov/BV:NaN))}</div>

function fmtR(v,u){ if(!isFinite(v)) return '—'; if(u==='%') return pct(v); if(u==='x') return v.toFixed(2)+'×'; if(u==='d') return Math.round(v)+T(' يوم',' d'); return fmt(v); }
function rAssess(r,v){ if(!r.th||!isFinite(v)) return null; const [a,b]=r.th; if(r.dir>0) return v>=a?'good':v>=b?'warn':'bad'; return v<=a?'good':v<=b?'warn':'bad'; }
const ASSESS_TXT={good:['جيد','Good'],warn:['يحتاج متابعة','Watch'],bad:['ضعيف','Weak']};
function trendArrow(r,cur,prev){ if(!isFinite(cur)||!isFinite(prev)||cur===prev) return ''; const up=cur>prev, better=r.dir>0?up:!up; return `<span class="${better?'up':'down'}" title="${better?T('تحسّن','Improved'):T('تراجع','Worsened')}">${up?'▲':'▼'}</span>`; }

function altman(d){ const x1=div(d.ca-d.cl,d.ta),x2=div(d.retained,d.ta),x3=div(d.ebit,d.ta),x4=div(d.equity,d.tl),x5=div(d.revenue,d.ta);
 const z=fs.zModel==='zp'?0.717*x1+0.847*x2+3.107*x3+0.420*x4+0.998*x5:6.56*x1+3.26*x2+6.72*x3+1.05*x4; const M=ZMODELS[fs.zModel]||ZMODELS.z2;
 const zone=!isFinite(z)?null:z>M.safe?'good':z>M.grey?'warn':'bad'; return {x1,x2,x3,x4,x5,z,zone}; }
const ZONE_TXT={good:['منطقة الأمان','Safe zone'],warn:['المنطقة الرمادية','Grey zone'],bad:['منطقة الخطر','Distress zone']};
function piotroski(d,p){ const roa=div(d.net,d.ta), proa=div(p.net,p.ta);
 const c=[
  [T('العائد على الأصول موجب','ROA is positive'),roa>0],
  [T('التدفق التشغيلي موجب','Operating cash flow is positive'),d.cfo>0],
  [T('تحسّن العائد على الأصول','ROA improved'),roa>proa],
  [T('التدفق التشغيلي أعلى من صافي الربح','Operating cash flow exceeds net income'),d.cfo>d.net],
  [T('انخفاض الديون طويلة الأجل إلى الأصول','Long-term debt to assets fell'),div(d.ltDebt,d.ta)<div(p.ltDebt,p.ta)],
  [T('تحسّن نسبة التداول','Current ratio improved'),div(d.ca,d.cl)>div(p.ca,p.cl)],
  [T('لم تُصدر أسهم جديدة','No new shares issued'),isFinite(d.shares)&&isFinite(p.shares)?d.shares<=p.shares:null],
  [T('تحسّن هامش مجمل الربح','Gross margin improved'),div(d.gross,d.revenue)>div(p.gross,p.revenue)],
  [T('تحسّن دوران الأصول','Asset turnover improved'),div(d.revenue,d.ta)>div(p.revenue,p.ta)]];
 const valid=c.filter(x=>x[1]!==null), score=valid.filter(x=>x[1]).length, max=valid.length, r=score/max;
 return {c,score,max,zone:r>=7/9?'good':r>=4/9?'warn':'bad'}; }
function beneish(d,p){ const gm=x=>div(x.gross,x.revenue);
 const v={DSRI:div(div(d.rec,d.revenue),div(p.rec,p.revenue)),GMI:div(gm(p),gm(d)),AQI:div(1-div(d.ca+d.ppe,d.ta),1-div(p.ca+p.ppe,p.ta)),SGI:div(d.revenue,p.revenue),
  DEPI:div(div(p.dep,p.dep+p.ppe),div(d.dep,d.dep+d.ppe)),SGAI:div(div(d.sga,d.revenue),div(p.sga,p.revenue)),LVGI:div(div(d.cl+d.ltDebt,d.ta),div(p.cl+p.ltDebt,p.ta)),TATA:div(d.net-d.cfo,d.ta)};
 const m=-4.84+0.92*v.DSRI+0.528*v.GMI+0.404*v.AQI+0.892*v.SGI+0.115*v.DEPI-0.172*v.SGAI+4.679*v.TATA-0.327*v.LVGI;
 return {v,m,zone:!isFinite(m)?null:m>-1.78?'bad':m>-2.22?'warn':'good'}; }

function feToMc(){
 const f0=feEff(fe), c=feCalc(f0); if(c.err){ toast(c.err); return; }
 const N=c.N, r=c.r, tx=num(f0.tax)/100, S=num(f0.salvage), W=num(f0.wc), fg=num(f0.fg)/100, R1=Math.round(num(f0.rev1)), g=num(f0.g)/100, v=+(num(f0.varPct)/100).toFixed(4), F=Math.round(num(f0.fixed)), I=num(f0.inv);
 const terms=[]; for(let t=1;t<=N;t++){ const ebit=`(rev1*(1+growth)^${t-1}*(1-var_pct) - fixed*${(+Math.pow(1+fg,t-1).toFixed(6))} - (inv-${S})/${N})`;
  terms.push(`(${ebit} - max(0, ${ebit})*${tx} + (inv-${S})/${N})/${(+Math.pow(1+r,t).toFixed(6))}`); }
 const formula=`-(inv+${W}) + ${terms.join(' + ')} + ${S+W}/${(+Math.pow(1+r,N).toFixed(6))}`;
 const r3=x=>+x.toPrecision(4);
 const m={name:fe.name+' · '+T('مخاطر الجدوى','feasibility risk'),inputs:[
   mk('rev1',T('إيرادات السنة الأولى','Year-1 revenue'),'triang',{min:r3(R1*0.8),mode:R1,max:r3(R1*1.15)}),
   mk('growth',T('نمو الإيرادات','Revenue growth'),'pert',{min:r3(g-0.03),mode:g,max:r3(g+0.02)}),
   mk('var_pct',T('التكاليف المتغيرة %','Variable cost %'),'pert',{min:r3(Math.max(0,v-0.03)),mode:v,max:r3(v+0.05)}),
   mk('fixed',T('التكاليف الثابتة','Fixed costs'),'normal',{mean:F,sd:r3(F*0.07)}),
   mk('inv',T('الاستثمار الأولي','Initial investment'),'triang',{min:r3(I*0.95),mode:I,max:r3(I*1.25)})],
  outputs:[{id:rid(),name:'project_npv',label:T('صافي القيمة الحالية','Net present value'),formula,target:'0',dir:'above'}],corr:[],settings:{iter:10000,method:'lhs',seed:''}};
 saveCurrent(true); loadModel(m); location.hash='#risk'; toast(T('أُنشئ نموذج المخاطر. عدّل النطاقات حسب تقديرك.','Risk model created. Adjust the ranges to your judgement.'));
}

 const b=sxy/sxx, a=my-b*mx; let sse=0; for(let i=0;i<n;i++) sse+=(ys[i]-a-b*xs[i])**2; const se=Math.sqrt(sse/(n-2)), seb=se/Math.sqrt(sxx), sea=se*Math.sqrt(1/n+mx*mx/sxx), t=b/seb;

function capSvg(r){ const W=720,H=300,m={l:46,r:18,t:30,b:40}; let lo=Math.min(r.sorted[0],isFinite(r.L)?r.L:Infinity,r.mean-3.5*r.sdO);

function spcCalc(){ const x=numList(ls.spc).filter(Number.isFinite), n=x.length; if(n<8) return null;

 x.forEach((v,i)=>{ if(v>ucl||v<lcl) add(i,1); });
 for(let i=8;i<n;i++){ const w=x.slice(i-8,i+1); if(w.every(v=>v>mean)||w.every(v=>v<mean)) add(i,2); }
 for(let i=5;i<n;i++){ const w=x.slice(i-5,i+1); let up=true,dn=true; for(let j=1;j<6;j++){ if(!(w[j]>w[j-1])) up=false; if(!(w[j]<w[j-1])) dn=false; } if(up||dn) add(i,3); }

 for(const t of niceTicks(a,b,4)){ if(t<a||t>b) continue; g+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${m.l-8}" y="${Y(t)+4}" text-anchor="end">${fmtShort(t)}</text>`; }
 const hl=(v,lab,cls)=>`<line class="${cls}" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="val" x="${W-m.r+6}" y="${Y(v)+4}">${lab} ${fmtShort(v)}</text>`;

 g+=`<path class="ln" fill="none" stroke="var(--accent)" stroke-width="1.8" d="${vals.map((v,i)=>(i?'L':'M')+X(i+off).toFixed(1)+','+Y(v).toFixed(1)).join('')}"/>`;
 vals.forEach((v,i)=>{ const bad=flags&&flags.has(i+off); g+=`<circle cx="${X(i+off).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${bad?5:3.2}" fill="${bad?'var(--bad)':'var(--accent)'}"${bad?' stroke="#fff" stroke-width="1.5"':''}><title>#${i+off+1}: ${fmt(v)}</title></circle>`; });
 for(let i=0;i<n;i+=Math.max(1,Math.ceil(n/12))) g+=`<text class="tick" x="${X(i)}" y="${H-m.b+18}" text-anchor="middle">${i+1}</text>`;

function lsSpc(P){ const r=spcCalc();
 const RULES={1:T('نقطة خارج حدود التحكم (±3σ)','Point beyond the control limits (±3σ)'),2:T('9 نقاط متتالية في جهة واحدة من الخط المركزي','9 points in a row on one side of the centre line'),3:T('6 نقاط متتالية صاعدة أو هابطة (اتجاه)','6 points in a row steadily rising or falling (trend)'),4:T('نقطتان من 3 بعد 2σ في الجهة نفسها','2 of 3 points beyond 2σ on the same side'),5:T('مدى متحرك يتجاوز حده الأعلى (قفزة مفاجئة)','Moving range above its upper limit (sudden jump)')};

function lsFmea(P){ const rows=fmeaRows(), tot=rows.reduce((a,r)=>a+r.rpn,0); let cum=0;
 P.innerHTML=`<div class="stack"><h3>${T('سطر لكل نمط فشل: الوصف، الخطورة S، الحدوث O، الاكتشاف D (من 1 إلى 10)','One failure mode per line: description, severity S, occurrence O, detection D (1–10)')}</h3>
  <textarea id="ls-fmea" rows="6" spellcheck="false" style="font-size:13.5px" aria-label="FMEA">${esc(ls.fmea)}</textarea>
  <div class="row"><button class="btn primary" id="ls-go">${T('احسب الأولويات','Rank risks')}</button></div>${lsSampleNote()}
  ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>#</th><th>${T('نمط الفشل','Failure mode')}</th><th class="n">S</th><th class="n">O</th><th class="n">D</th><th class="n">RPN</th><th class="n">${T('تراكمي','Cumulative')}</th><th>${T('الأولوية','Priority')}</th></tr></thead><tbody>
   ${rows.map((r,i)=>{ cum+=r.rpn; const hi=r.rpn>=200||r.s>=9, md=r.rpn>=100||r.s>=7; return `<tr><td>${i+1}</td><td>${esc(r.mode)}</td><td class="n">${r.s}</td><td class="n">${r.o}</td><td class="n">${r.d}</td><td class="n"><b>${r.rpn}</b></td><td class="n">${pct(cum/tot,0)}</td><td>${hi?chip('bad',T('عاجل','Act now')):md?chip('warn',T('خطة تحسين','Plan action')):chip('good',T('مراقبة','Monitor'))}</td></tr>`; }).join('')}
  </tbody></table></div>
  <div class="callout info"><span>${T(`أعلى خطر: «${esc(rows[0].mode)}» برقم أولوية ${rows[0].rpn}. ابدأ بالبنود العاجلة؛ أي بند خطورته 9 أو 10 يُعالج حتى لو كان RPN منخفضاً. بعد التحسين أعد التقييم وقارن RPN الجديد بالقديم.`,`Top risk: “${esc(rows[0].mode)}” with RPN ${rows[0].rpn}. Start with “Act now” items; anything with severity 9–10 is treated even if its RPN is low. Re-score after improvements and compare the new RPN.`)}</span></div>
  <p class="note">${T('RPN = الخطورة × الحدوث × الاكتشاف (الحد الأقصى 1000). الاكتشاف: 1 يعني اكتشافاً شبه مؤكد، و10 يعني أنه لن يُكتشف.','RPN = severity × occurrence × detection (max 1000). Detection: 1 means almost certain to be caught, 10 means it will not be caught.')}</p>`
  :`<p class="empty">${T('أدخل نمط فشل واحداً على الأقل بثلاث درجات من 1 إلى 10.','Enter at least one failure mode with three scores from 1 to 10.')}</p>`}</div>`;
 $('#ls-go').onclick=()=>{ ls.fmea=$('#ls-fmea').value; lsSave(); lsFmea(P); }; }

function taxCalc(){ const C=cInfo(tax.country)||cInfo('ae'), P=num(tax.profit)||0, fs=Math.min(100,Math.max(0,num(tax.foreign)||0))/100, rev=num(tax.revenue)||0; let cit=0, zakat=0, note='';
 if(tax.country==='ae'){ if(tax.small==='yes'&&rev<=3e6){ cit=0; note=T('إعفاء الأعمال الصغيرة','Small Business Relief'); } else if(tax.freezone==='yes'){ cit=0; note=T('شخص مؤهل في منطقة حرة (على الدخل المؤهل)','Qualifying Free Zone Person (on qualifying income)'); } else cit=Math.max(0,P-375000)*0.09; }
 else if(tax.country==='sa'){ cit=P*fs*0.20; const zb=num(tax.zakatBase); zakat=(isFinite(zb)&&zb>0?zb:Math.max(0,P))*(1-fs)*0.025; if(!(zb>0)) note=T('الزكاة تقديرية على الربح لعدم إدخال الوعاء الزكوي','Zakat estimated on profit as no zakat base was entered'); }
 else if(tax.country==='qa') cit=Math.max(0,P)*fs*0.10;
 else if(tax.country==='kw') cit=Math.max(0,P)*fs*0.15;
 else if(tax.country==='om') cit=Math.max(0,P)*(tax.small==='yes'?0.03:0.15);
 else if(!C.gcc){ const rr=num(tax.citRate); cit=Math.max(0,P)*(isFinite(rr)?rr:C.citRate)/100; note=T('النسبة الرئيسية فقط','Headline rate only'); }
 const etr=P>0?(cit+zakat)/P:0, gr=num(tax.groupRev)||0, p2=gr>=750e6, topup=p2&&P>0&&etr<0.15?(0.15-etr)*P:0;
 const vr=!C.gcc&&isFinite(num(tax.vatRate))?num(tax.vatRate):C.vat; C.vat=vr; const r=vr/100, std=Math.min(100,Math.max(0,num(tax.stdShare)||0))/100, out=(num(tax.sales)||0)*std*r, inp=(num(tax.purch)||0)*r*Math.min(100,Math.max(0,num(tax.recov)||0))/100, vatM=out-inp;
 const per=tax.freq==='month'?1:3, months=[]; const fy=Math.min(12,Math.max(1,Math.round(num(tax.fyEnd)||12)));
 for(let m=1;m<=12;m++){ let v=0; if(C.vat&&m%per===0) v=vatM*per; let c=0; if(C.citDue&&((fy+C.citDue-1)%12)+1===m) c=cit+zakat+topup; months.push({m,v,c}); }
 const annual=vatM*12+cit+zakat+topup;
 return {C,cit,zakat,etr,p2,topup,vatM,out,inp,months,annual,reserve:annual/12,note,fs}; }

function mdLite(src){ const lines=esc(src).split('\n'); let h='', list=null, tbl=[];
 const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
 const flushL=()=>{ if(list){ h+=`</${list}>`; list=null; } }; const flushT=()=>{ if(tbl.length){ const rows=tbl.filter(r=>!/^\|[\s:|-]+\|$/.test(r)); h+='<div class="tbl-wrap"><table>'+rows.map((r,i)=>{ const c=r.replace(/^\||\|$/g,'').split('|').map(x=>inl(x.trim())); return `<tr>${c.map(x=>i?`<td>${x}</td>`:`<th>${x}</th>`).join('')}</tr>`; }).join('')+'</table></div>'; tbl=[]; } };
 for(const raw of lines){ const l=raw.trimEnd();
  if(/^\s*\|.*\|\s*$/.test(l)){ flushL(); tbl.push(l.trim()); continue; } else flushT();
  let m;
  if(m=l.match(/^#{1,4}\s+(.*)/)){ flushL(); h+=`<h4>${inl(m[1])}</h4>`; }
  else if(m=l.match(/^\s*[-*•]\s+(.*)/)){ if(list!=='ul'){ flushL(); h+='<ul>'; list='ul'; } h+=`<li>${inl(m[1])}</li>`; }
  else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){ if(list!=='ol'){ flushL(); h+='<ol>'; list='ol'; } h+=`<li>${inl(m[1])}</li>`; }
  else if(!l.trim()){ flushL(); }
  else { flushL(); h+=`<p>${inl(l)}</p>`; } }
 flushL(); flushT(); return h; }

function taxDrawChat(){ const el=$('#tax-chat'); if(!el) return;
 el.innerHTML=taxChat.map((m,i)=>m.role==='user'?`<div style="align-self:flex-end;max-width:85%;background:linear-gradient(110deg,var(--accent-soft),var(--accent2-soft));border:1px solid var(--glass-brd);border-radius:14px;padding:10px 14px">${esc(m.content)}</div>`

 $$('[data-copy]',el).forEach(b=>b.onclick=()=>copyText(taxChat[+b.dataset.copy].content));

async function taxAsk(q,tier){
 if(!taxSampleFn){ toast(T('المستشار الذكي غير متاح هنا','AI advisor is not available here')); return; }
 if(taxCtl) taxCtl.abort();
 taxChat.push({role:'user',content:q}); const msg={role:'assistant',content:'',pending:true}; taxChat.push(msg); taxDrawChat();
 const btns=$$('.tax-ask'); btns.forEach(b=>b.disabled=true); const stop=$('#tax-stop'); if(stop) stop.hidden=false;
 const ctl=new AbortController(); taxCtl=ctl;
 const turns=[{role:'user',content:TAX_RULES()},{role:'assistant',content:T('فهمت ملف الشركة والمرجع. ما سؤالك؟','Understood the profile and reference. What is your question?')},...taxChat.filter(m=>m!==msg&&m.content).slice(-8).map(m=>({role:m.role,content:m.content}))];
 let raf=0; const paint=()=>{ raf=0; const el=$(`.ai-msg[data-i="${taxChat.indexOf(msg)}"]`); if(el) el.innerHTML=mdLite(msg.content); };
 try{ const r=await taxSampleFn(turns,{signal:ctl.signal,cache:false,modelTier:tier||'default',onText:({text})=>{ msg.content=text; if(!raf) raf=requestAnimationFrame(paint); }});
  msg.content=r.text; if(r.truncated) msg.err=T('توقفت الإجابة لطولها. اطلب جزءاً محدداً.','The answer was cut short. Ask for a narrower part.'); }
 catch(e){ msg.content=e&&e.text||msg.content; const code=e&&e.code;
  if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'){ taxSampleFn=null; taxAiStatus(); msg.err=T('لم يُسمح للموقع باستخدام Claude.','The site was not allowed to use Claude.'); }
  else if(code==='rate_limited') msg.err=T('تم بلوغ حد الاستخدام مؤقتاً. حاول لاحقاً.','Usage limit reached for now. Try again later.');
  else if(code==='refused') { msg.content=''; msg.err=T('لم يتمكن المستشار من الإجابة على هذا السؤال. أعد صياغته.','The advisor could not answer this. Please rephrase.'); }
  else if(code!=='cancelled') msg.err=T('انقطع الاتصال. حاول مرة أخرى.','The connection was interrupted. Please try again.');
  if(!msg.content&&code==='cancelled') msg.content=T('أُوقفت الإجابة.','Stopped.'); }
 finally{ msg.pending=false; if(taxCtl===ctl) taxCtl=null; taxDrawChat(); $$('.tax-ask').forEach(b=>b.disabled=!taxSampleFn); const s=$('#tax-stop'); if(s) s.hidden=true; }
}

function newsWhen(a,b){ const d0=new Date(); d0.setHours(0,0,0,0); const s=new Date(a+'T00:00:00'), e=b?new Date(b+'T00:00:00'):s; const days=Math.round((s-d0)/864e5);
 if(d0>=s&&d0<=e) return {txt:T('جارٍ الآن','Happening now'),cls:'now',days:0};
 if(days===0) return {txt:T('اليوم','Today'),cls:'now',days};
 if(days===1) return {txt:T('غداً','Tomorrow'),cls:'soon',days};
 return {txt:T(`بعد ${days} يوماً`,`in ${days} days`),cls:days<=7?'soon':'',days}; }
const newsDate=d=>new Date(d+'T00:00:00').toLocaleDateString(lang==='ar'?'ar':'en',{day:'numeric',month:'short'});
function newsUpcoming(){ const d0=new Date(); d0.setHours(0,0,0,0); return NEWS.events.filter(([a,b])=>new Date((b||a)+'T00:00:00')>=d0); }

const LIVE={gold:null,silver:null,cal:null,heads:null,headsLang:null};
const NEWS_SRC={metal:s=>`https://api.gold-api.com/price/${s}`,cal:'https://nfs.faireconomy.media/ff_calendar_thisweek.json',
 gdelt:l=>'https://api.gdeltproject.org/api/v2/doc/doc?mode=artlist&format=json&maxrecords=25&timespan=8h&sort=datedesc&query='+encodeURIComponent(l==='ar'
  ?'(اقتصاد OR التضخم OR الفائدة OR النفط OR البورصة OR الذهب OR "البنك المركزي") sourcelang:arabic'
  :'(economy OR inflation OR "interest rates" OR "central bank" OR "oil prices" OR "stock market" OR gold OR GDP) sourcelang:english')};
async function getJSON(u,ms=9000){ const c=new AbortController(), t=setTimeout(()=>c.abort(),ms); try{ const r=await fetch(u,{signal:c.signal,cache:'no-store'}); if(!r.ok) throw new Error(r.status); return await r.json(); } finally{ clearTimeout(t); } }
async function loadMetals(){ for(const [k,s] of [['gold','XAU'],['silver','XAG']]){ try{ const j=await getJSON(NEWS_SRC.metal(s)); if(j&&isFinite(j.price)){ const prev=LIVE[k]; LIVE[k]={p:+j.price,at:j.updatedAt?new Date(j.updatedAt):new Date(),dir:prev?Math.sign(+j.price-prev.p)||prev.dir:0}; } }catch(e){} } }
async function loadCal(){ try{ const j=await getJSON(NEWS_SRC.cal); if(Array.isArray(j)) LIVE.cal=j.filter(e=>e&&e.date&&(e.impact==='High'||e.impact==='Medium')).map(e=>({t:new Date(e.date),title:e.title,c:e.country,imp:e.impact,f:e.forecast,pr:e.previous})).filter(e=>!isNaN(e.t)); }catch(e){} }
const gdTime=s=>{ const m=/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)Z$/.exec(s||''); return m?new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6])):null; };
async function loadHeads(){ const l=lang; try{ const j=await getJSON(NEWS_SRC.gdelt(l),12000); const seen=new Set(); const a=((j&&j.articles)||[]).map(x=>({title:(x.title||'').replace(/\s+/g,' ').trim(),url:x.url,src:x.domain,t:gdTime(x.seendate)})).filter(x=>{ const k=x.title.toLowerCase().slice(0,60); if(!x.title||x.title.length<25||!x.t||seen.has(k)) return false; seen.add(k); return /^https?:/.test(x.url||''); }).slice(0,14);
 if(a.length){ LIVE.heads=a; LIVE.headsLang=l; } }catch(e){} }

function inT(d){ const m=Math.round((d-Date.now())/6e4); if(m<=0) return T('الآن','now'); if(m<60) return T(`بعد ${m} د`,`in ${m}m`); const h=Math.floor(m/60); return T(`بعد ${h} س${m%60?` ${m%60} د`:''}`,`in ${h}h${m%60?` ${m%60}m`:''}`); }

 else parts.push(`<span class="tk-lab live">${T('أهم الأخبار الاقتصادية','Top economic news')}</span>`+NEWS.items.map(([ar,en])=>`<span class="tk-item"><i class="tk-dot"></i>${esc(T(ar,en))}</span>`).join(''));

function impStatements(rows){ let hdr=-1, yc=[];

 if(!yc.length) return 0; const years=hdr>=0?yc.map(j=>String(rows[hdr][j]).trim()):yc.map((_,i)=>fs.years[i]||String(new Date().getFullYear()-yc.length+1+i));

const exCleared=new Set();
const EX_ICON={clear:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',ex:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>'};
function exInject(){ const id=curPage().id, ex=EX[id], m=$('#main'); if(!m||!ex) return; const h=$('.page-head',m); if(!h) return;
 let b=$('.ex-btn',h); const s=ex.is()?'1':'0';
 if(!b){ b=document.createElement('button'); b.className='btn ex-btn'; b.type='button'; h.appendChild(b); b.onclick=()=>exClick(b); }
 if(b.dataset.c||b.dataset.s===s+lang) return; b.dataset.s=s+lang;
 b.innerHTML=s==='1'?`${EX_ICON.clear}${T('محو البيانات','Clear data')}`:`${EX_ICON.ex}${T('المثال','Example')}`;
 b.title=s==='1'?T('امسح بيانات المثال لتدخل بياناتك الفعلية','Clear the example data to enter your own'):T('أعد تحميل بيانات المثال','Reload the example data'); }
function exClick(b){ const id=curPage().id, ex=EX[id]; if(!ex) return;
 if(ex.is()){ ex.clear(); exCleared.add(id); toast(T('مُسحت بيانات المثال. أدخل بياناتك الفعلية','Example data cleared. Enter your real data')); renderPage(); return; }
 if(!exCleared.has(id)&&!b.dataset.c){ b.dataset.c='1'; b.classList.add('ex-confirm'); b.textContent=T('اضغط مرة أخرى: ستُستبدل بياناتك بالمثال','Click again: your data will be replaced'); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.c; b.classList.remove('ex-confirm'); b.dataset.s=''; exInject(); } },3500); return; }
 ex.restore(); exCleared.delete(id); toast(T('عادت بيانات المثال','Example data restored')); renderPage(); }
let exObs=null;
function exWatch(){ const m=$('#main'); if(!m) return; if(exObs) exObs.disconnect(); let q=false; exObs=new MutationObserver(()=>{ if(q) return; q=true; queueMicrotask(()=>{ q=false; exInject(); formEnhance(); repInject(); impInline(); insSchedule(); }); }); exObs.observe(m,{childList:true,subtree:true}); }
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{ if(!e.target.closest||!e.target.closest('#main')) return; exCleared.delete(curPage().id); setTimeout(exInject,0); }));

/* ================= accounts: email sign-up / sign-in via Supabase, with cloud sync ================= */
const AUTH_CFG=window.RASEEN_CONFIG||{};
const authOn=!!(AUTH_CFG.supabaseUrl&&AUTH_CFG.supabaseAnonKey);
let sb=null, authUser=null, syncState='', syncT=null;
const SYNC_RE=/^(raseen\.|riskLab\.)/, SYNC_SKIP=new Set(['raseen.syncedAt']);
function loadSb(){ return new Promise((res,rej)=>{ if(window.supabase) return res(); const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'; s.onload=()=>res(); s.onerror=()=>rej(new Error('load')); document.head.appendChild(s); }); }
async function authInit(){ renderAuthChip(); if(!authOn) return;
 try{ await loadSb(); sb=window.supabase.createClient(AUTH_CFG.supabaseUrl,AUTH_CFG.supabaseAnonKey);
  const {data}=await sb.auth.getSession(); await setUser(data.session?.user||null);
  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==='PASSWORD_RECOVERY'){ openAuth('reset'); return; } const u=session?.user||null; if((u&&u.id)!==(authUser&&authUser.id)) setUser(u); });
 }catch(e){ syncState='offline'; renderAuthChip(); } }
async function setUser(u){ authUser=u; renderAuthChip(); if(u) await pullCloud(); }
const localSnapshot=()=>{ const d={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(SYNC_RE.test(k)&&!SYNC_SKIP.has(k)) d[k]=localStorage.getItem(k); } }catch(e){} return d; };
async function pullCloud(){ if(!sb||!authUser) return; syncState='sync'; renderAuthChip();
 const {data,error}=await sb.from('user_data').select('data,updated_at').eq('user_id',authUser.id).maybeSingle();
 if(error){ syncState='error'; renderAuthChip(); return; }
 const localAt=(()=>{ try{ return localStorage.getItem('raseen.syncedAt')||''; }catch(e){ return ''; } })();
 if(data&&data.data&&Object.keys(data.data).length&&data.updated_at>localAt){
  try{ Object.keys(localSnapshot()).forEach(k=>localStorage.removeItem(k)); Object.entries(data.data).forEach(([k,v])=>localStorage.setItem(k,v)); localStorage.setItem('raseen.syncedAt',data.updated_at); }catch(e){}
  location.reload(); return; }
 await pushCloud(); }
async function pushCloud(){ if(!sb||!authUser) return; syncState='sync'; renderAuthChip(); const at=new Date().toISOString();
 const {error}=await sb.from('user_data').upsert({user_id:authUser.id,data:localSnapshot(),updated_at:at});
 if(error){ syncState='error'; } else { syncState='ok'; try{ localStorage.setItem('raseen.syncedAt',at); }catch(e){} } renderAuthChip(); }
const _storeSet=store.set; store.set=(k,v)=>{ _storeSet(k,v); if(authUser&&SYNC_RE.test(k)&&!SYNC_SKIP.has(k)){ clearTimeout(syncT); syncT=setTimeout(pushCloud,2000); } };
async function signOut(){ if(sb) await sb.auth.signOut(); try{ Object.keys(localSnapshot()).forEach(k=>{ if(k!=='raseen.lang2') localStorage.removeItem(k); }); localStorage.removeItem('raseen.syncedAt'); }catch(e){} location.reload(); }

function authName(){ const m=authUser?.user_metadata||{}; return m.full_name||authUser?.email||''; }
function renderAuthChip(){ const html=authUser?`<div class="auth-chip"><span class="av">${esc((authName()[0]||'?').toUpperCase())}</span><span class="who"><b>${esc(authName())}</b><small>${syncState==='sync'?T('جارٍ المزامنة…','Syncing…'):syncState==='error'?T('تعذرت المزامنة','Sync failed'):T('محفوظ في حسابك','Saved to your account')}</small></span><button class="tool-btn" id="auth-out" title="${T('تسجيل الخروج','Sign out')}">${T('خروج','Sign out')}</button></div>`
  :`<button class="tool-btn auth-open" style="width:100%">${T('تسجيل الدخول / حساب جديد','Sign in / Create account')}</button>`;
 const s=$('#auth-slot'); if(s) s.innerHTML=html; const m=$('#auth-slot2'); if(m) m.innerHTML=authUser?`<button class="tool-btn" id="auth-out2" aria-label="${T('تسجيل الخروج','Sign out')}"><span class="av sm">${esc((authName()[0]||'?').toUpperCase())}</span></button>`:`<button class="tool-btn auth-open">${T('دخول','Sign in')}</button>`;
 $$('.auth-open').forEach(b=>b.onclick=()=>openAuth('login'));
 const o=$('#auth-out'); if(o) o.onclick=signOut; const o2=$('#auth-out2'); if(o2) o2.onclick=()=>openAuth('account'); }

function openAuth(mode){ $('.auth-modal')?.remove(); const w=document.createElement('div'); w.className='palette auth-modal'; w.dir=lang==='ar'?'rtl':'ltr'; w.setAttribute('role','dialog'); w.setAttribute('aria-modal','true');
 const close=()=>w.remove(); const field=(id,lab,type='text',ac='')=>`<label class="pf"><span>${lab}</span><input id="${id}" type="${type}" autocomplete="${ac}" dir="${type==='email'||type==='password'?'ltr':'auto'}" required></label>`;
 const tabs=['login','signup'].includes(mode)?`<div class="seg" style="width:100%"><button data-m="login" aria-pressed="${mode==='login'}" style="flex:1">${T('تسجيل الدخول','Sign in')}</button><button data-m="signup" aria-pressed="${mode==='signup'}" style="flex:1">${T('حساب جديد','Create account')}</button></div>`:'';
 let body='';
 if(!authOn) body=`<h3>${T('الحسابات غير مفعلة في هذه النسخة','Accounts are not enabled in this copy')}</h3><p class="note">${T('التسجيل وتسجيل الدخول يعملان في نسخة الموقع المنشورة على الدومين بعد ربطها بمنصة الحسابات. يمكنك الآن استخدام كل الأدوات، وبياناتك تُحفظ في هذا المتصفح.','Sign-up and sign-in work on the site published on its domain once it is connected to the accounts platform. You can use every tool now; your data is saved in this browser.')}</p><div class="row"><button class="btn primary" data-close>${T('حسناً','OK')}</button></div>`;
 else if(mode==='login') body=`${tabs}<form class="stack" id="au-f">${field('au-email',T('البريد الإلكتروني','Email'),'email','email')}${field('au-pass',T('كلمة المرور','Password'),'password','current-password')}<button class="btn primary" type="submit">${T('دخول','Sign in')}</button><button class="btn small" type="button" data-m="forgot" style="align-self:flex-start">${T('نسيت كلمة المرور؟','Forgot password?')}</button></form>`;
 else if(mode==='signup') body=`${tabs}<form class="stack" id="au-f">${field('au-name',T('الاسم الكامل','Full name'),'text','name')}${field('au-email',T('البريد الإلكتروني','Email'),'email','email')}${field('au-pass',T('كلمة المرور (8 أحرف على الأقل)','Password (at least 8 characters)'),'password','new-password')}${field('au-pass2',T('تأكيد كلمة المرور','Confirm password'),'password','new-password')}<button class="btn primary" type="submit">${T('إنشاء الحساب','Create account')}</button></form>`;
 else if(mode==='forgot') body=`<h3>${T('استعادة كلمة المرور','Reset password')}</h3><form class="stack" id="au-f">${field('au-email',T('البريد الإلكتروني','Email'),'email','email')}<button class="btn primary" type="submit">${T('أرسل رابط الاستعادة','Send reset link')}</button><button class="btn small" type="button" data-m="login" style="align-self:flex-start">${T('رجوع لتسجيل الدخول','Back to sign in')}</button></form>`;
 else if(mode==='reset') body=`<h3>${T('كلمة مرور جديدة','New password')}</h3><form class="stack" id="au-f">${field('au-pass',T('كلمة المرور الجديدة','New password'),'password','new-password')}<button class="btn primary" type="submit">${T('حفظ','Save')}</button></form>`;
 else if(mode==='account') body=`<h3>${esc(authName())}</h3><p class="note" dir="ltr">${esc(authUser?.email||'')}</p><p class="note">${T('بياناتك في كل الأدوات تُحفظ في حسابك تلقائياً، وتجدها على أي جهاز تسجل منه.','Your data in every tool is saved to your account automatically and follows you to any device.')}</p><div class="row"><button class="btn" id="au-out">${T('تسجيل الخروج','Sign out')}</button><button class="btn" data-close>${T('إغلاق','Close')}</button></div>`;
 w.innerHTML=`<div class="palette-box" style="padding:20px;display:flex;flex-direction:column;gap:14px"><div class="row" style="justify-content:space-between"><b style="font-family:var(--f-display);font-size:18px">figurdiscover</b><button class="icon-btn" data-close aria-label="${T('إغلاق','Close')}">×</button></div>${body}<p class="note" id="au-msg" role="status"></p></div>`;
 document.body.appendChild(w);
 w.onclick=e=>{ if(e.target===w||e.target.closest('[data-close]')) close(); const m=e.target.closest('[data-m]'); if(m){ e.preventDefault(); openAuth(m.dataset.m); } };
 const ao=$('#au-out',w); if(ao) ao.onclick=signOut;
 const msg=(t,ok)=>{ const el=$('#au-msg',w); el.textContent=t; el.style.color=ok?'var(--good)':'var(--bad)'; };
 const errTxt=e=>{ const m=String(e&&e.message||e); if(/Invalid login/i.test(m)) return T('البريد أو كلمة المرور غير صحيحة','Wrong email or password'); if(/not confirmed/i.test(m)) return T('أكّد بريدك أولاً من الرسالة التي أرسلناها','Confirm your email first using the link we sent'); if(/already registered|already exists/i.test(m)) return T('هذا البريد مسجل مسبقاً، سجّل الدخول','This email is already registered. Sign in instead'); if(/rate|too many/i.test(m)) return T('محاولات كثيرة، انتظر قليلاً','Too many attempts. Wait a moment'); return T('حدث خطأ: ','Error: ')+m; };
 const f=$('#au-f',w); if(f){ setTimeout(()=>{ const i=$('input',f); if(i) i.focus(); },30);
  f.onsubmit=async e=>{ e.preventDefault(); const btn=$('button[type=submit]',f); btn.disabled=true; msg('');
   const v=id=>($('#'+id,w)?.value||'').trim();
   try{
    if(mode==='login'){ const {error}=await sb.auth.signInWithPassword({email:v('au-email'),password:$('#au-pass',w).value}); if(error) throw error; msg(T('تم تسجيل الدخول','Signed in'),true); setTimeout(close,500); }
    if(mode==='signup'){ const p=$('#au-pass',w).value; if(p.length<8) throw {message:T('كلمة المرور قصيرة، 8 أحرف على الأقل','Password must be at least 8 characters')}; if(p!==$('#au-pass2',w).value) throw {message:T('كلمتا المرور غير متطابقتين','Passwords do not match')};
     const {data,error}=await sb.auth.signUp({email:v('au-email'),password:p,options:{data:{full_name:v('au-name')},emailRedirectTo:location.origin+location.pathname}}); if(error) throw error;
     if(data.session){ msg(T('تم إنشاء الحساب وتسجيل الدخول','Account created and signed in'),true); setTimeout(close,700); } else msg(T('أرسلنا رسالة تأكيد إلى بريدك. افتحها ثم سجّل الدخول.','We sent a confirmation email. Open it, then sign in.'),true); }
    if(mode==='forgot'){ const {error}=await sb.auth.resetPasswordForEmail(v('au-email'),{redirectTo:location.origin+location.pathname}); if(error) throw error; msg(T('إن كان البريد مسجلاً فستصلك رسالة بالرابط.','If the email is registered, a reset link is on its way.'),true); }
    if(mode==='reset'){ const p=$('#au-pass',w).value; if(p.length<8) throw {message:T('كلمة المرور قصيرة، 8 أحرف على الأقل','Password must be at least 8 characters')}; const {error}=await sb.auth.updateUser({password:p}); if(error) throw error; msg(T('تم تغيير كلمة المرور','Password changed'),true); setTimeout(close,800); }
   }catch(err){ msg(errTxt(err)); } finally{ btn.disabled=false; } }; } }
