/* ---------- 4. Lean metrics ---------- */
function lsLean(P){
 P.innerHTML=`<div class="calc-grid" data-live>
  <section class="panel"><div><h3>${T('زمن الإيقاع Takt time','Takt time')}</h3><p class="note">${T('السرعة التي يجب أن تُنتَج بها الوحدة لتلبية طلب العميل.','The pace at which one unit must be finished to meet customer demand.')}</p></div>
   <div class="form-grid">${lsField('avail','الوقت المتاح في اليوم','Available time per day',T('دقيقة','min'))}${lsField('breaks','الاستراحات والتوقفات المخططة','Planned breaks',T('دقيقة','min'))}${lsField('demand','الطلب اليومي','Daily demand',T('وحدة','units'))}</div><div id="ln-takt"></div></section>
  <section class="panel"><div><h3>${T('الفعالية الشاملة للمعدات OEE','Overall equipment effectiveness (OEE)')}</h3><p class="note">${T('التوافر × الأداء × الجودة.','Availability × performance × quality.')}</p></div>
   <div class="form-grid">${lsField('plan','وقت الإنتاج المخطط','Planned production time',T('دقيقة','min'))}${lsField('down','وقت التوقف غير المخطط','Unplanned downtime',T('دقيقة','min'))}${lsField('ict','زمن الدورة المثالي للوحدة','Ideal cycle time per unit',T('دقيقة','min'))}${lsField('total','إجمالي الوحدات المنتجة','Total units produced')}${lsField('good','الوحدات السليمة','Good units')}</div><div id="ln-oee"></div></section>
  <section class="panel"><div><h3>${T('كفاءة دورة العملية PCE','Process cycle efficiency (PCE)')}</h3><p class="note">${T('نسبة الوقت الذي يضيف قيمة فعلية للعميل من إجمالي زمن التسليم.','Share of total lead time that actually adds value for the customer.')}</p></div>
   <div class="form-grid">${lsField('va','وقت القيمة المضافة','Value-added time',T('ساعة','h'))}${lsField('lead','زمن التسليم الكلي','Total lead time',T('ساعة','h'))}</div><div id="ln-pce"></div></section>
  <section class="panel"><div><h3>${T('قانون ليتل','Little’s law')}</h3><p class="note">${T('زمن التسليم = المخزون تحت التشغيل ÷ معدل الإنجاز.','Lead time = work in progress ÷ throughput.')}</p></div>
   <div class="form-grid">${lsField('wip','العمل تحت التشغيل WIP','Work in progress (WIP)',T('وحدة','units'))}${lsField('thru','معدل الإنجاز','Throughput',T('وحدة/يوم','units/day'))}</div><div id="ln-little"></div></section></div>
  ${lsSampleNote()}`;
 lsLeanOut(); }
function lsLeanOut(){ const put=(id,h)=>{ const e=$('#'+id); if(e) e.innerHTML=h; }, bad=`<p class="note">${T('أدخل قيماً صحيحة','Enter valid values')}</p>`;
 const net=lsN('avail')-lsN('breaks'), dem=lsN('demand');
 put('ln-takt',net>0&&dem>0?lsOut([[T('زمن الإيقاع','Takt time'),`${fmt(net/dem,2)} ${T('دقيقة/وحدة','min/unit')}`],[T('بالثواني','In seconds'),`${fmt(net*60/dem,0)} ${T('ث','s')}`],[T('الوقت الصافي المتاح','Net available time'),`${fmt(net,0)} ${T('دقيقة','min')}`]])+`<p class="note">${T('إذا كان زمن دورة أي محطة أطول من زمن الإيقاع فهي عنق زجاجة ولن تلبي الطلب.','Any station with a cycle time longer than takt is a bottleneck and will miss demand.')}</p>`:bad);
 const pl=lsN('plan'), dn=lsN('down'), ict=lsN('ict'), tot=lsN('total'), gd=lsN('good');
 if(pl>0&&dn>=0&&dn<pl&&ict>0&&tot>0&&gd>=0&&gd<=tot){ const A=(pl-dn)/pl, Pf=Math.min(1,ict*tot/(pl-dn)), Q=gd/tot, O=A*Pf*Q, worst=[[A,T('التوافر','availability')],[Pf,T('الأداء','performance')],[Q,T('الجودة','quality')]].sort((a,b)=>a[0]-b[0])[0];
  put('ln-oee',`<div class="kpis"><div class="kpi ${lsBand(O,.85,.6)}"><span class="k"><span>OEE</span></span><span class="v">${pct(O)}</span></div><div class="kpi"><span class="k"><span>${T('التوافر','Availability')}</span></span><span class="v">${pct(A)}</span></div><div class="kpi"><span class="k"><span>${T('الأداء','Performance')}</span></span><span class="v">${pct(Pf)}</span></div><div class="kpi"><span class="k"><span>${T('الجودة','Quality')}</span></span><span class="v">${pct(Q)}</span></div></div>
   <p class="note">${T(`المعيار العالمي 85%. ${O>=.85?'أداء عالمي.':`أكبر فاقد في ${worst[1]} (${pct(worst[0])}): ابدأ التحسين منه.`}`,`World class is 85%. ${O>=.85?'World-class performance.':`The biggest loss is ${worst[1]} (${pct(worst[0])}): start improvement there.`}`)}</p>`); } else put('ln-oee',bad);
 const va=lsN('va'), ld=lsN('lead'); put('ln-pce',va>0&&ld>=va?lsOut([[T('الكفاءة PCE','PCE'),pct(va/ld)],[T('وقت الهدر (بلا قيمة)','Non-value-added time'),`${fmt(ld-va)} ${T('ساعة','h')}`]])+`<p class="note">${T(`العملية تُعد «لين» عند 25% فأكثر. ${va/ld<.25?`هنا ${pct(1-va/ld)} من الوقت انتظار ونقل وفحص: هذا مجال التحسين.`:'كفاءة جيدة.'}`,`A process is considered lean at 25% or more. ${va/ld<.25?`Here ${pct(1-va/ld)} of the time is waiting, moving or checking: that is the improvement opportunity.`:'Good efficiency.'}`)}</p>`:bad);
 const wip=lsN('wip'), th=lsN('thru'); put('ln-little',wip>=0&&th>0?lsOut([[T('زمن التسليم المتوقع','Expected lead time'),`${fmt(wip/th,2)} ${T('يوم','days')}`],[T('إذا خُفِّض WIP للنصف','If WIP is halved'),`${fmt(wip/th/2,2)} ${T('يوم','days')}`]]):bad); }

function fmeaRows(){ return numLines(ls.fmea).map(l=>{ const p=l.split(/[,\t;،]/).map(s=>s.trim()); const [s,o,d]=p.slice(-3).map(num); return {mode:p.slice(0,-3).join(', ')||'—',s,o,d}; }).filter(r=>[r.s,r.o,r.d].every(v=>isFinite(v)&&v>=1&&v<=10)).map(r=>({...r,rpn:r.s*r.o*r.d})).sort((a,b)=>b.rpn-a.rpn||b.s-a.s); }

 P.innerHTML=`<div class="stack"><h3>${T('سطر لكل نمط فشل: الوصف، الخطورة S، الحدوث O، الاكتشاف D (من 1 إلى 10)','One failure mode per line: description, severity S, occurrence O, detection D (1–10)')}</h3>

function mdLite(src){ const lines=esc(src).split('\n'); let h='', list=null, tbl=[];
 const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
 const flushL=()=>{ if(list){ h+=`</${list}>`; list=null; } }; const flushT=()=>{ if(tbl.length){ const rows=tbl.filter(r=>!/^\|[\s:|-]+\|$/.test(r)); h+='<div class="tbl-wrap"><table>'+rows.map((r,i)=>{ const c=r.replace(/^\||\|$/g,'').split('|').map(x=>inl(x.trim())); return `<tr>${c.map(x=>i?`<td>${x}</td>`:`<th>${x}</th>`).join('')}</tr>`; }).join('')+'</table></div>'; tbl=[]; } };
 for(const raw of lines){ const l=raw.trimEnd();
  if(/^\s*\|.*\|\s*$/.test(l)){ flushL(); tbl.push(l.trim()); continue; } else flushT();
  let m;
  if(m=l.match(/^#{1,4}\s+(.*)/)){ flushL(); h+=`<h4>${inl(m[1])}</h4>`; }
  else if(m=l.match(/^\s*[-*•]\s+(.*)/)){ if(list!=='ul'){ flushL(); h+='<ul>'; list='ul'; } h+=`<li>${inl(m[1])}</li>`; }
  else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){ if(list!=='ol'){ flushL(); h+='<ol>'; list='ol'; } h+=`<li>${inl(m[1])}</li>`; }
  else if(!l.trim()){ flushL(); }
  else { flushL(); h+=`<p>${inl(l)}</p>`; } }
 flushL(); flushT(); return h; }

async function taxAsk(q,tier){

 if(taxCtl) taxCtl.abort();
 taxChat.push({role:'user',content:q}); const msg={role:'assistant',content:'',pending:true}; taxChat.push(msg); taxDrawChat();
 const btns=$$('.tax-ask'); btns.forEach(b=>b.disabled=true); const stop=$('#tax-stop'); if(stop) stop.hidden=false;
 const ctl=new AbortController(); taxCtl=ctl;
 const turns=[{role:'user',content:TAX_RULES()},{role:'assistant',content:T('فهمت ملف الشركة والمرجع. ما سؤالك؟','Understood the profile and reference. What is your question?')},...taxChat.filter(m=>m!==msg&&m.content).slice(-8).map(m=>({role:m.role,content:m.content}))];
 let raf=0; const paint=()=>{ raf=0; const el=$(`.ai-msg[data-i="${taxChat.indexOf(msg)}"]`); if(el) el.innerHTML=mdLite(msg.content); };
 try{ const r=await taxSampleFn(turns,{signal:ctl.signal,cache:false,modelTier:tier||'default',onText:({text})=>{ msg.content=text; if(!raf) raf=requestAnimationFrame(paint); }});
  msg.content=r.text; if(r.truncated) msg.err=T('توقفت الإجابة لطولها. اطلب جزءاً محدداً.','The answer was cut short. Ask for a narrower part.'); }
 catch(e){ msg.content=e&&e.text||msg.content; const code=e&&e.code;
  if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'){ taxSampleFn=null; taxAiStatus(); msg.err=T('لم يُسمح للموقع باستخدام Claude.','The site was not allowed to use Claude.'); }
  else if(code==='rate_limited') msg.err=T('تم بلوغ حد الاستخدام مؤقتاً. حاول لاحقاً.','Usage limit reached for now. Try again later.');
  else if(code==='refused') { msg.content=''; msg.err=T('لم يتمكن المستشار من الإجابة على هذا السؤال. أعد صياغته.','The advisor could not answer this. Please rephrase.'); }
  else if(code!=='cancelled') msg.err=T('انقطع الاتصال. حاول مرة أخرى.','The connection was interrupted. Please try again.');
  if(!msg.content&&code==='cancelled') msg.content=T('أُوقفت الإجابة.','Stopped.'); }
 finally{ msg.pending=false; if(taxCtl===ctl) taxCtl=null; taxDrawChat(); $$('.tax-ask').forEach(b=>b.disabled=!taxSampleFn); const s=$('#tax-stop'); if(s) s.hidden=true; }
}

function calWin(){ if(!LIVE.cal) return {past:[],next:[]}; const n=Date.now(); return {past:LIVE.cal.filter(e=>e.t<=n&&n-e.t<=H_PAST*36e5).sort((a,b)=>b.t-a.t),next:LIVE.cal.filter(e=>e.t>n&&e.t-n<=H_NEXT*36e5).sort((a,b)=>a.t-b.t)}; }
const isLive=()=>!!(LIVE.gold||LIVE.cal||LIVE.heads);
const ext=(u,txt)=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${txt}</a>`;
const fmtUsd=v=>'$'+v.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
function metalChip(k,ar,en){ const m=LIVE[k]; if(!m) return ''; const arr=m.dir>0?'<i class="tk-up">▲</i>':m.dir<0?'<i class="tk-dn">▼</i>':''; return `<span class="tk-item tk-px"><b>${T(ar,en)}</b><bdi dir="ltr">${fmtUsd(m.p)}</bdi>${arr}<small>${hm(m.at)}</small></span>`; }
const impTag=e=>`<b class="tk-imp ${e.imp==='High'?'hi':''}" title="${e.imp==='High'?T('تأثير مرتفع','High impact'):T('تأثير متوسط','Medium impact')}">${esc(e.c)}</b>`;
const calTxt=e=>`${esc(e.title)}${e.f?` <small>${T('المتوقع','fcst')}: <bdi dir="ltr">${esc(e.f)}</bdi></small>`:''}${e.pr?` <small>${T('السابق','prev')}: <bdi dir="ltr">${esc(e.pr)}</bdi></small>`:''}`;
function tickSeq(){ const w=calWin(), parts=[];
 const px=metalChip('gold','الذهب','Gold')+metalChip('silver','الفضة','Silver'); if(px) parts.push(`<span class="tk-lab px">${T('أسعار مباشرة','Live prices')}</span>${px}`);
 const heads=LIVE.heads&&LIVE.headsLang===lang?LIVE.heads:null;
 const past=(heads||[]).map(h=>`<span class="tk-item"><b class="tk-when">${ago(h.t)}</b>${ext(h.url,esc(h.title))}<small>${esc(h.src||'')}</small></span>`).join('')
  +w.past.map(e=>`<span class="tk-item"><b class="tk-when">${T('صدر','out')} ${hm(e.t)}</b>${impTag(e)}${calTxt(e)}</span>`).join('');
 if(past) parts.push(`<span class="tk-lab live">${T('خلال الساعات الماضية','Last few hours')}</span>${past}`);
 else parts.push(`<span class="tk-lab live">${T('أهم الأخبار الاقتصادية','Top economic news')}</span>`+NEWS.items.map(([ar,en])=>`<span class="tk-item"><i class="tk-dot"></i>${esc(T(ar,en))}</span>`).join(''));
 if(w.next.length) parts.push(`<span class="tk-lab next">${T('خلال الساعات القادمة','Next few hours')}</span>`+w.next.map(e=>{ const soon=e.t-Date.now()<=3*36e5; return `<span class="tk-item"><b class="tk-when ${soon?'soon':''}">${inT(e.t)} · ${hm(e.t)}</b>${impTag(e)}${calTxt(e)}</span>`; }).join(''));
 parts.push(`<span class="tk-lab next">${T('أحداث اقتصادية منتظرة','Economic events ahead')}</span>`+newsUpcoming().map(([a,b,ar,en])=>{ const w2=newsWhen(a,b); return `<span class="tk-item"><b class="tk-when ${w2.cls}">${w2.txt}</b>${esc(T(ar,en))} <small>${newsDate(a)}</small></span>`; }).join(''));
 return parts.join(''); }
function tickCount(){ const w=calWin(); return (LIVE.heads?LIVE.heads.length:NEWS.items.length)+w.past.length+w.next.length+newsUpcoming().length+2; }
function badgeHtml(){ return isLive()?`<i class="tk-pulse"></i>${T('مباشر','Live')}`:`${T('آخر تحديث','Updated')} ${newsDate(NEWS.updated)}`; }
function tickerHtml(){ const seq=tickSeq();
 return `<div class="ticker" role="region" aria-label="${T('شريط الأخبار الاقتصادية','Economic news ticker')}">
  <span class="tk-badge${isLive()?'':' off'}" id="tk-badge">${badgeHtml()}</span>
  <div class="tk-view"><div class="tk-track${tickPaused?' paused':''}" style="--dur:${Math.max(60,tickCount()*7)}s">${seq}<span aria-hidden="true" style="display:contents">${seq}</span></div></div>
  <button class="tk-btn" id="tk-pause" aria-label="${tickPaused?T('تشغيل الشريط','Play ticker'):T('إيقاف الشريط','Pause ticker')}">${tickPaused?'<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>':'<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'}</button>
  <button class="tk-btn tk-all" id="tk-all" aria-expanded="false">${T('عرض الكل','View all')}</button>
 </div><div class="tk-panel" id="tk-panel" hidden></div>`; }
function tickerPanel(){ const up=newsUpcoming(), w=calWin(), heads=LIVE.heads&&LIVE.headsLang===lang?LIVE.heads:null;
 const evRow=(e,lab,cls)=>`<div class="tk-ev"><span class="tk-date tm"><b>${hm(e.t)}</b><small>${e.t.toLocaleDateString(lang==='ar'?'ar':'en',{day:'numeric',month:'short'})}</small></span>${impTag(e)}<span style="flex:1;min-width:0">${calTxt(e)}</span><span class="tk-when ${cls}">${lab}</span></div>`;
 const px=(LIVE.gold||LIVE.silver)?`<div class="tk-pxrow">${['gold','silver'].filter(k=>LIVE[k]).map(k=>`<div class="tk-pxcard"><small>${k==='gold'?T('الذهب (أونصة)','Gold (oz)'):T('الفضة (أونصة)','Silver (oz)')}</small><b dir="ltr">${fmtUsd(LIVE[k].p)}</b><small>${T('آخر تحديث','Updated')} ${hm(LIVE[k].at)}</small></div>`).join('')}</div>`:'';
 const left=heads?`<h3>${T('أخبار اقتصادية صدرت خلال الساعات الماضية','Economic news from the last few hours')}</h3><ul class="tk-list">${heads.map(h=>`<li>${ext(h.url,esc(h.title))} <small class="note">${esc(h.src||'')} · ${ago(h.t)}</small></li>`).join('')}</ul>`
  :`<h3>${T('أهم الأخبار الاقتصادية العالمية','Key world economic news')}</h3><ul class="tk-list">${NEWS.items.map(([ar,en])=>`<li>${esc(T(ar,en))}</li>`).join('')}</ul>`;
 const pastCal=w.past.length?`<h3>${T(`بيانات صدرت خلال آخر ${H_PAST} ساعة`,`Data released in the last ${H_PAST} hours`)}</h3><div class="tk-events">${w.past.map(e=>evRow(e,ago(e.t),'')).join('')}</div>`:'';
 const nextCal=LIVE.cal?`<h3>${T(`خلال الـ ${H_NEXT} ساعة القادمة`,`Next ${H_NEXT} hours`)}</h3><div class="tk-events">${w.next.map(e=>evRow(e,inT(e.t),e.t-Date.now()<=3*36e5?'soon':'')).join('')||`<p class="note">${T('لا توجد بيانات مهمة مجدولة خلال هذه الفترة.','No major data scheduled in this window.')}</p>`}</div>`:'';
 return `${px}<div class="two"><div class="stack" style="gap:8px">${left}${pastCal}</div>
  <div class="stack" style="gap:8px">${nextCal}<h3>${T('الأحداث الاقتصادية المنتظرة','Upcoming economic events')}</h3><div class="tk-events">${up.map(([a,b,ar,en])=>{ const w2=newsWhen(a,b); return `<div class="tk-ev"><span class="tk-date"><b>${new Date(a+'T00:00:00').getDate()}</b><small>${new Date(a+'T00:00:00').toLocaleDateString(lang==='ar'?'ar':'en',{month:'short'})}</small></span><span style="flex:1;min-width:0">${esc(T(ar,en))}${b?` <small class="note">(${newsDate(a)} – ${newsDate(b)})</small>`:''}</span><span class="tk-when ${w2.cls}">${w2.txt}</span></div>`; }).join('')||`<p class="note">${T('لا توجد أحداث قادمة في القائمة.','No upcoming events listed.')}</p>`}</div></div></div>
  <p class="note">${isLive()?T('بيانات مباشرة: سعر الذهب والفضة من gold-api.com (يتحدث كل دقيقة)، والأجندة الاقتصادية من ForexFactory، والعناوين من GDELT (تتحدث كل 10 دقائق). الأوقات بتوقيت جهازك.','Live data: gold and silver from gold-api.com (refreshed every minute), economic calendar from ForexFactory, headlines from GDELT (refreshed every 10 minutes). Times are in your local time zone.')
   :T(`تعذّر الاتصال بمصادر البيانات المباشرة هنا، فتظهر قائمة محفوظة بتاريخ ${newsDate(NEWS.updated)} 2026. على موقعك المستضاف تُجلب الأسعار والأخبار مباشرة.`,`Live sources could not be reached here, so a saved list from ${newsDate(NEWS.updated)} 2026 is shown. On your hosted site, prices and news load live.`)}</p>`; }
function refreshTicker(){ const tr=$('.tk-track'), b=$('#tk-badge'); if(!tr) return; tr.innerHTML=`${tickSeq()}<span aria-hidden="true" style="display:contents">${tickSeq()}</span>`; tr.style.setProperty('--dur',Math.max(60,tickCount()*7)+'s');
 if(b){ b.innerHTML=badgeHtml(); b.classList.toggle('off',!isLive()); } const panel=$('#tk-panel'); if(panel&&!panel.hidden) panel.innerHTML=tickerPanel(); }
let newsTimers=null;
function startLive(){ if(newsTimers||typeof fetch!=='function') return; newsTimers=1;
 const run=async f=>{ await f(); refreshTicker(); };
 Promise.allSettled([loadMetals(),loadCal(),loadHeads()]).then(refreshTicker);
 setInterval(()=>run(loadMetals),60e3); setInterval(()=>run(loadCal),30*60e3); setInterval(()=>run(loadHeads),10*60e3); setInterval(refreshTicker,60e3); }
function bindTicker(){ const p=$('#tk-pause'), a=$('#tk-all'), panel=$('#tk-panel'); if(!p) return;
 if(LIVE.headsLang&&LIVE.headsLang!==lang) loadHeads().then(refreshTicker);
 p.onclick=()=>{ tickPaused=!tickPaused; $('.tk-track').classList.toggle('paused',tickPaused); p.innerHTML=tickPaused?'<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>':'<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'; p.setAttribute('aria-label',tickPaused?T('تشغيل الشريط','Play ticker'):T('إيقاف الشريط','Pause ticker')); };
 a.onclick=()=>{ const open=panel.hidden; panel.hidden=!open; a.setAttribute('aria-expanded',String(open)); a.textContent=open?T('إخفاء','Hide'):T('عرض الكل','View all'); if(open) panel.innerHTML=tickerPanel(); };
 startLive(); }

/* ================= form clarity: units inside fields, thousands separators, calculated tags, validation ================= */
const FE_BIG=/^-?\d{4,}(\.\d+)?$/;
const feGroup=v=>{ const s=String(v).trim(); if(!FE_BIG.test(s)) return null; const [i,d]=s.split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(d!=null?'.'+d:''); };
const feRaw=v=>String(v).replace(/,(?=\d{3}(\D|$))/g,'');
function feUnit(span){ if(!span) return null; let unit=null, pre=false;
 const sm=span.querySelector('small'); if(sm){ unit=sm.textContent.replace(/[()]/g,'').trim(); sm.remove(); }
 const tn=[...span.childNodes].reverse().find(n=>n.nodeType===3&&n.textContent.trim()); if(!tn) return unit?{unit,pre}:null; let t=tn.textContent;
 const rules=[[/\s*%\s*$/,'%'],[/\s*\((years|سنوات|بالسنوات)\)\s*$/i,T('سنة','yrs')],[/\s*\((AED|SAR|QAR|KWD|BHD|OMR|USD|EUR|GBP|EGP|JOD|[A-Z]{3})\)\s*$/,null]];
 if(!unit) for(const [re,u] of rules){ const m=t.match(re); if(m){ unit=u||m[1]; pre=!u; t=t.replace(re,''); break; } }
 tn.textContent=t; return unit?{unit,pre}:null; }
function formEnhance(){ const m=$('#main'); if(!m||curPage().id==='risk') return;
 if(!m.dataset.feBound){ m.dataset.feBound='1';
  m.addEventListener('focusin',e=>{ const i=e.target; if(i.dataset&&i.dataset.fe==='n'&&i.value.includes(',')) i.value=feRaw(i.value); });
  m.addEventListener('focusout',e=>{ const i=e.target; if(i.dataset&&i.dataset.fe==='n'){ const g=feGroup(i.value); if(g) i.value=g; } });
  m.addEventListener('input',e=>{ const i=e.target; if(!i.dataset||i.dataset.fe!=='n') return; const v=i.value.trim(), bad=v!==''&&!isFinite(num(v)); i.classList.toggle('in-bad',bad); const w=i.closest('.pf'); if(w) w.classList.toggle('pf-bad',bad); }); }
 $$('input',m).forEach(i=>{ if(i.dataset.fe||i.type==='checkbox'||i.type==='radio'||i.type==='range') return;
  const numeric=i.getAttribute('inputmode')==='decimal'||(i.dir==='ltr'&&i.closest('.pf')&&!i.readOnly&&isFinite(num(i.value||'0')));
  i.dataset.fe=numeric?'n':'t';
  if(numeric&&document.activeElement!==i){ const g=feGroup(i.value); if(g) i.value=g; }
  const pf=i.closest('.pf'), span=pf&&pf.querySelector(':scope > span');
  if(pf&&!pf.dataset.fe){ pf.dataset.fe='1';
   if(numeric){ const u=feUnit(span); if(u){ const w=document.createElement('span'); w.className='inwrap'+(u.pre?' pre':''); i.parentNode.insertBefore(w,i); w.appendChild(i); w.insertAdjacentHTML('beforeend',`<span class="unit" aria-hidden="true">${esc(u.unit)}</span>`); i.setAttribute('aria-label',(span?span.textContent.trim():'')+' ('+u.unit+')'); } }
   if(i.readOnly&&span&&!span.querySelector('.auto-tag')) span.insertAdjacentHTML('beforeend',` <em class="auto-tag">${T('محسوب تلقائياً','auto')}</em>`);
   if(numeric) pf.insertAdjacentHTML('beforeend',`<small class="pf-err" role="alert">${T('أدخل رقماً فقط','Numbers only')}</small>`); } });
 $$('.calc-out',m).forEach(c=>{ if(!c.dataset.cap) c.dataset.cap=T('النتائج','Results'); }); }

const EX={
 statements:{is:()=>!!fs.sample,clear:()=>{ Object.keys(fs.data).forEach(k=>fs.data[k]=fs.years.map(()=>'')); fs.company=''; fs.sample=false; fsSub='input'; fsSave(); },restore:()=>{ fs=fsSample(); fsSave(); }},
 feasibility:{is:()=>!!fe.sample,clear:()=>{ Object.assign(fe,{sample:false,name:'',inv:'',wc:'',salvage:'',rev1:'',fixed:'',loan:'',sales:[],exps:[]}); feSub='detail'; feSave(); },restore:()=>{ fe=feSample(); feSave(); }},
 calc:{is:()=>Object.keys(CA_DEF).every(k=>String(ca[k])===String(CA_DEF[k])),clear:()=>{ Object.keys(CA_DEF).forEach(k=>ca[k]=''); caSave(); },restore:()=>{ Object.assign(ca,CA_DEF); caSave(); }},
 stats:{is:()=>['desc','reg','trend','ta','tb'].every(isSample),clear:()=>{ ['desc','reg','trend','ta','tb'].forEach(k=>stS[k]=''); stS.mu0=''; },restore:()=>{ ['desc','reg','trend','ta','tb'].forEach(k=>stS[k]=ST_SAMPLES[k]); stS.mu0='4'; }},
 risk:{is:()=>model.isExample===true||(model.isExample===undefined&&/\((مثال|example)\)/i.test(model.name||'')),clear:()=>{ loadModel({...TEMPLATES.blank(),isExample:false}); },restore:()=>{ loadModel(TEMPLATES.cost()); }},
 benford:{is:()=>!benState||!!benState.sample,clear:()=>{ benState={text:'',test:'first',min10:true,sample:false,res:null}; },restore:()=>{ benState=null; }},
 pareto:{is:()=>!parState||!!parState.sample,clear:()=>{ parState={text:'',cutA:80,cutB:95,sample:false,res:null,lang}; },restore:()=>{ parState=null; }},
 tax:{is:()=>!!tax.sample,clear:()=>{ tax={...taxSample(),sample:false,sector:'',revenue:'',profit:'',foreign:'',groupRev:'',sales:'',purch:'',zakatBase:'',erp:'',related:'none',einv:{},country:tax.country}; taxChat=[]; taxSave(); },restore:()=>{ tax=taxSample(); taxChat=[]; taxSave(); }}};
EX.lss={is:()=>lsIsSample(),clear:()=>{ Object.keys(LS_DEF).forEach(k=>ls[k]=''); lsSave(); },restore:()=>{ Object.assign(ls,LS_DEF); lsSave(); }};
['duplicates','numtests','outliers','sequence','sampling'].forEach(k=>EX[k]={is:()=>!!tx.sample,clear:()=>{ tx.text=''; tx.sample=false; txSave(); },restore:()=>{ tx.text=txSample(); tx.sample=true; tx.lang=lang; txSave(); }});
const exCleared=new Set();
const EX_ICON={clear:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',ex:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>'};
function exInject(){ const id=curPage().id, ex=EX[id], m=$('#main'); if(!m||!ex) return; const h=$('.page-head',m); if(!h) return;
 let b=$('.ex-btn',h); const s=ex.is()?'1':'0';
 if(!b){ b=document.createElement('button'); b.className='btn ex-btn'; b.type='button'; h.appendChild(b); b.onclick=()=>exClick(b); }
 if(b.dataset.c||b.dataset.s===s+lang) return; b.dataset.s=s+lang;
 b.innerHTML=s==='1'?`${EX_ICON.clear}${T('محو البيانات','Clear data')}`:`${EX_ICON.ex}${T('المثال','Example')}`;
 b.title=s==='1'?T('امسح بيانات المثال لتدخل بياناتك الفعلية','Clear the example data to enter your own'):T('أعد تحميل بيانات المثال','Reload the example data'); }
function exClick(b){ const id=curPage().id, ex=EX[id]; if(!ex) return;
 if(ex.is()){ ex.clear(); exCleared.add(id); toast(T('مُسحت بيانات المثال. أدخل بياناتك الفعلية','Example data cleared. Enter your real data')); renderPage(); return; }
 if(!exCleared.has(id)&&!b.dataset.c){ b.dataset.c='1'; b.classList.add('ex-confirm'); b.textContent=T('اضغط مرة أخرى: ستُستبدل بياناتك بالمثال','Click again: your data will be replaced'); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.c; b.classList.remove('ex-confirm'); b.dataset.s=''; exInject(); } },3500); return; }
 ex.restore(); exCleared.delete(id); toast(T('عادت بيانات المثال','Example data restored')); renderPage(); }
let exObs=null;
function exWatch(){ const m=$('#main'); if(!m) return; if(exObs) exObs.disconnect(); let q=false; exObs=new MutationObserver(()=>{ if(q) return; q=true; queueMicrotask(()=>{ q=false; exInject(); formEnhance(); }); }); exObs.observe(m,{childList:true,subtree:true}); }
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{ if(!e.target.closest||!e.target.closest('#main')) return; exCleared.delete(curPage().id); setTimeout(exInject,0); }));
document.addEventListener('click',e=>{ if(e.target.closest&&e.target.closest('#main button:not(.ex-btn)')) setTimeout(exInject,50); });

/* ================= accounts: email sign-up / sign-in via Supabase, with cloud sync ================= */
const AUTH_CFG=window.RASEEN_CONFIG||{};
const authOn=!!(AUTH_CFG.supabaseUrl&&AUTH_CFG.supabaseAnonKey);
let sb=null, authUser=null, syncState='', syncT=null;
const SYNC_RE=/^(raseen\.|riskLab\.)/, SYNC_SKIP=new Set(['raseen.syncedAt']);
function loadSb(){ return new Promise((res,rej)=>{ if(window.supabase) return res(); const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'; s.onload=()=>res(); s.onerror=()=>rej(new Error('load')); document.head.appendChild(s); }); }
async function authInit(){ renderAuthChip(); if(!authOn) return;
 try{ await loadSb(); sb=window.supabase.createClient(AUTH_CFG.supabaseUrl,AUTH_CFG.supabaseAnonKey);
  const {data}=await sb.auth.getSession(); await setUser(data.session?.user||null);
  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==='PASSWORD_RECOVERY'){ openAuth('reset'); return; } const u=session?.user||null; if((u&&u.id)!==(authUser&&authUser.id)) setUser(u); });
 }catch(e){ syncState='offline'; renderAuthChip(); } }
async function setUser(u){ authUser=u; renderAuthChip(); if(u) await pullCloud(); }
const localSnapshot=()=>{ const d={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(SYNC_RE.test(k)&&!SYNC_SKIP.has(k)) d[k]=localStorage.getItem(k); } }catch(e){} return d; };
async function pullCloud(){ if(!sb||!authUser) return; syncState='sync'; renderAuthChip();
 const {data,error}=await sb.from('user_data').select('data,updated_at').eq('user_id',authUser.id).maybeSingle();
 if(error){ syncState='error'; renderAuthChip(); return; }
 const localAt=(()=>{ try{ return localStorage.getItem('raseen.syncedAt')||''; }catch(e){ return ''; } })();
 if(data&&data.data&&Object.keys(data.data).length&&data.updated_at>localAt){
  try{ Object.keys(localSnapshot()).forEach(k=>localStorage.removeItem(k)); Object.entries(data.data).forEach(([k,v])=>localStorage.setItem(k,v)); localStorage.setItem('raseen.syncedAt',data.updated_at); }catch(e){}
  location.reload(); return; }
 await pushCloud(); }
async function pushCloud(){ if(!sb||!authUser) return; syncState='sync'; renderAuthChip(); const at=new Date().toISOString();
 const {error}=await sb.from('user_data').upsert({user_id:authUser.id,data:localSnapshot(),updated_at:at});
 if(error){ syncState='error'; } else { syncState='ok'; try{ localStorage.setItem('raseen.syncedAt',at); }catch(e){} } renderAuthChip(); }
const _storeSet=store.set; store.set=(k,v)=>{ _storeSet(k,v); if(authUser&&SYNC_RE.test(k)&&!SYNC_SKIP.has(k)){ clearTimeout(syncT); syncT=setTimeout(pushCloud,2000); } };
async function signOut(){ if(sb) await sb.auth.signOut(); try{ Object.keys(localSnapshot()).forEach(k=>{ if(k!=='raseen.lang2') localStorage.removeItem(k); }); localStorage.removeItem('raseen.syncedAt'); }catch(e){} location.reload(); }

function authName(){ const m=authUser?.user_metadata||{}; return m.full_name||authUser?.email||''; }
function renderAuthChip(){ const html=authUser?`<div class="auth-chip"><span class="av">${esc((authName()[0]||'?').toUpperCase())}</span><span class="who"><b>${esc(authName())}</b><small>${syncState==='sync'?T('جارٍ المزامنة…','Syncing…'):syncState==='error'?T('تعذرت المزامنة','Sync failed'):T('محفوظ في حسابك','Saved to your account')}</small></span><button class="tool-btn" id="auth-out" title="${T('تسجيل الخروج','Sign out')}">${T('خروج','Sign out')}</button></div>`
  :`<button class="tool-btn auth-open" style="width:100%">${T('تسجيل الدخول / حساب جديد','Sign in / Create account')}</button>`;

function openAuth(mode){ $('.auth-modal')?.remove(); const w=document.createElement('div'); w.className='palette auth-modal'; w.dir=lang==='ar'?'rtl':'ltr'; w.setAttribute('role','dialog'); w.setAttribute('aria-modal','true');

 let body='';

 else if(mode==='login') body=`${tabs}<form class="stack" id="au-f">${field('au-email',T('البريد الإلكتروني','Email'),'email','email')}${field('au-pass',T('كلمة المرور','Password'),'password','current-password')}<button class="btn primary" type="submit">${T('دخول','Sign in')}</button><button class="btn small" type="button" data-m="forgot" style="align-self:flex-start">${T('نسيت كلمة المرور؟','Forgot password?')}</button></form>`;
 else if(mode==='signup') body=`${tabs}<form class="stack" id="au-f">${field('au-name',T('الاسم الكامل','Full name'),'text','name')}${field('au-email',T('البريد الإلكتروني','Email'),'email','email')}${field('au-pass',T('كلمة المرور (8 أحرف على الأقل)','Password (at least 8 characters)'),'password','new-password')}${field('au-pass2',T('تأكيد كلمة المرور','Confirm password'),'password','new-password')}<button class="btn primary" type="submit">${T('إنشاء الحساب','Create account')}</button></form>`;
 else if(mode==='forgot') body=`<h3>${T('استعادة كلمة المرور','Reset password')}</h3><form class="stack" id="au-f">${field('au-email',T('البريد الإلكتروني','Email'),'email','email')}<button class="btn primary" type="submit">${T('أرسل رابط الاستعادة','Send reset link')}</button><button class="btn small" type="button" data-m="login" style="align-self:flex-start">${T('رجوع لتسجيل الدخول','Back to sign in')}</button></form>`;
 else if(mode==='reset') body=`<h3>${T('كلمة مرور جديدة','New password')}</h3><form class="stack" id="au-f">${field('au-pass',T('كلمة المرور الجديدة','New password'),'password','new-password')}<button class="btn primary" type="submit">${T('حفظ','Save')}</button></form>`;
 else if(mode==='account') body=`<h3>${esc(authName())}</h3><p class="note" dir="ltr">${esc(authUser?.email||'')}</p><p class="note">${T('بياناتك في كل الأدوات تُحفظ في حسابك تلقائياً، وتجدها على أي جهاز تسجل منه.','Your data in every tool is saved to your account automatically and follows you to any device.')}</p><div class="row"><button class="btn" id="au-out">${T('تسجيل الخروج','Sign out')}</button><button class="btn" data-close>${T('إغلاق','Close')}</button></div>`;
 w.innerHTML=`<div class="palette-box" style="padding:20px;display:flex;flex-direction:column;gap:14px"><div class="row" style="justify-content:space-between"><b style="font-family:var(--f-display);font-size:18px">figurdiscover</b><button class="icon-btn" data-close aria-label="${T('إغلاق','Close')}">×</button></div>${body}<p class="note" id="au-msg" role="status"></p></div>`;
 document.body.appendChild(w);
 w.onclick=e=>{ if(e.target===w||e.target.closest('[data-close]')) close(); const m=e.target.closest('[data-m]'); if(m){ e.preventDefault(); openAuth(m.dataset.m); } };
 const ao=$('#au-out',w); if(ao) ao.onclick=signOut;
 const msg=(t,ok)=>{ const el=$('#au-msg',w); el.textContent=t; el.style.color=ok?'var(--good)':'var(--bad)'; };
 const errTxt=e=>{ const m=String(e&&e.message||e); if(/Invalid login/i.test(m)) return T('البريد أو كلمة المرور غير صحيحة','Wrong email or password'); if(/not confirmed/i.test(m)) return T('أكّد بريدك أولاً من الرسالة التي أرسلناها','Confirm your email first using the link we sent'); if(/already registered|already exists/i.test(m)) return T('هذا البريد مسجل مسبقاً، سجّل الدخول','This email is already registered. Sign in instead'); if(/rate|too many/i.test(m)) return T('محاولات كثيرة، انتظر قليلاً','Too many attempts. Wait a moment'); return T('حدث خطأ: ','Error: ')+m; };
 const f=$('#au-f',w); if(f){ setTimeout(()=>{ const i=$('input',f); if(i) i.focus(); },30);
  f.onsubmit=async e=>{ e.preventDefault(); const btn=$('button[type=submit]',f); btn.disabled=true; msg('');
   const v=id=>($('#'+id,w)?.value||'').trim();
   try{
    if(mode==='login'){ const {error}=await sb.auth.signInWithPassword({email:v('au-email'),password:$('#au-pass',w).value}); if(error) throw error; msg(T('تم تسجيل الدخول','Signed in'),true); setTimeout(close,500); }
    if(mode==='signup'){ const p=$('#au-pass',w).value; if(p.length<8) throw {message:T('كلمة المرور قصيرة، 8 أحرف على الأقل','Password must be at least 8 characters')}; if(p!==$('#au-pass2',w).value) throw {message:T('كلمتا المرور غير متطابقتين','Passwords do not match')};
     const {data,error}=await sb.auth.signUp({email:v('au-email'),password:p,options:{data:{full_name:v('au-name')},emailRedirectTo:location.origin+location.pathname}}); if(error) throw error;
     if(data.session){ msg(T('تم إنشاء الحساب وتسجيل الدخول','Account created and signed in'),true); setTimeout(close,700); } else msg(T('أرسلنا رسالة تأكيد إلى بريدك. افتحها ثم سجّل الدخول.','We sent a confirmation email. Open it, then sign in.'),true); }
    if(mode==='forgot'){ const {error}=await sb.auth.resetPasswordForEmail(v('au-email'),{redirectTo:location.origin+location.pathname}); if(error) throw error; msg(T('إن كان البريد مسجلاً فستصلك رسالة بالرابط.','If the email is registered, a reset link is on its way.'),true); }
    if(mode==='reset'){ const p=$('#au-pass',w).value; if(p.length<8) throw {message:T('كلمة المرور قصيرة، 8 أحرف على الأقل','Password must be at least 8 characters')}; const {error}=await sb.auth.updateUser({password:p}); if(error) throw error; msg(T('تم تغيير كلمة المرور','Password changed'),true); setTimeout(close,800); }
   }catch(err){ msg(errTxt(err)); } finally{ btn.disabled=false; } }; } }
